name: photos

# Rebuilds public/photos.json whenever images change in public/images/tv/.
# This is what makes the iPhone Shortcut flow hands-off: upload a photo,
# GitHub regenerates the manifest, the TV picks it up on next launch.

on:
  push:
    paths:
      - 'public/images/tv/**'
      - 'scripts/make-photos-json.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate manifest
        run: node scripts/make-photos-json.mjs

      - name: Commit if changed
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@deltoro.dev"
          git add public/photos.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "photos: regenerate manifest"
            git push
          fi
